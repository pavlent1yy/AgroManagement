<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Пользователи')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Управление пользователями</h1>
        <a th:href="@{/admin/users/new}" class="btn btn-success">Добавить пользователя</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card form-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle table-agro mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Логин</th>
                        <th>ФИО</th>
                        <th>Роль</th>
                        <th>Статус</th>
                        <th class="text-end">Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td class="fw-semibold" th:text="${user.username}"></td>
                        <td th:text="${user.fullName}"></td>
                        <td><span class="badge text-bg-success" th:text="${user.role.displayName}"></span></td>
                        <td>
                            <span th:if="${user.active}" class="badge text-bg-success">Активен</span>
                            <span th:unless="${user.active}" class="badge text-bg-danger">Заблокирован</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-outline-primary">
                                Редактировать
                            </a>
                            <form th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}"
                                  method="post" class="d-inline">
                                <button class="btn btn-sm"
                                        th:classappend="${user.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                        type="submit"
                                        th:text="${user.active} ? 'Заблокировать' : 'Разблокировать'">
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
