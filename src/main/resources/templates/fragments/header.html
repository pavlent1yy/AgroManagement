<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — АгроУправление'">АгроУправление</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-agro mb-4" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="brand-icon">🌾</span>
            <span>АгроУправление</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Администрирование</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('AGRONOMIST')">
                    <a class="nav-link" th:href="@{/agronomist/dashboard}">Рабочий кабинет агронома</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('MECHANIC')">
                    <a class="nav-link" th:href="@{/mechanic/dashboard}">Рабочий кабинет механика</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STOREKEEPER')">
                    <a class="nav-link" th:href="@{/storekeeper/dashboard}">Рабочий кабинет кладовщика</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3 text-white">
                <span class="small" sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-light btn-sm" type="submit">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
