# Общие параметры приложения
spring.application.name=agro-management
server.port=8080

# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/agro_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Миграции Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Резервное копирование: команда pg_dump должна быть доступна в PATH
agro.backup.command=pg_dump
agro.backup.directory=backups

# Диагностика при необходимости
logging.level.com.agro=INFO
