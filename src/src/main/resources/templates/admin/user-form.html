<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Карточка пользователя')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h1 class="page-title" th:text="${userForm.id == null} ? 'Новый пользователь' : 'Редактирование пользователя'"></h1>

            <div class="card form-card">
                <div class="card-body p-4">
                    <form th:action="@{/admin/users/save}" th:object="${userForm}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="username" class="form-label">Логин</label>
                            <input id="username" th:field="*{username}" type="text" class="form-control"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="fullName" class="form-label">ФИО</label>
                            <input id="fullName" th:field="*{fullName}" type="text" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                 th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label">Роль</label>
                            <select id="role" th:field="*{role}" class="form-select"
                                    th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                                <option value="">Выберите роль</option>
                                <option th:each="role : ${roles}" th:value="${role}" th:text="${role.displayName}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input id="password" th:field="*{password}" type="password" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div class="form-text" th:if="${userForm.id != null}">
                                Оставьте поле пустым, чтобы сохранить текущий пароль.
                            </div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input id="active" th:field="*{active}" type="checkbox" class="form-check-input">
                            <label for="active" class="form-check-label">Учетная запись активна</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-success" type="submit">Сохранить</button>
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
