<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Кабинет агронома')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Кабинет агронома</h1>
        <span class="badge text-bg-success">Роль: Агроном</span>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-body p-4">
                    <div class="card-icon bg-success">🌱</div>
                    <h2 class="h5">Планирование посевов</h2>
                    <p class="text-muted">Формирование сезонных планов посевных работ.</p>
                    <a th:href="@{/agronomist/planning}" class="btn btn-success">Открыть</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-body p-4">
                    <div class="card-icon bg-primary">🛰️</div>
                    <h2 class="h5">Мониторинг полей</h2>
                    <p class="text-muted">Контроль состояния полей и сельскохозяйственных культур.</p>
                    <button class="btn btn-outline-primary" type="button" disabled>Открыть</button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-body p-4">
                    <div class="card-icon bg-warning">📈</div>
                    <h2 class="h5">Анализ урожайности</h2>
                    <p class="text-muted">Оценка плановых и фактических показателей урожайности.</p>
                    <button class="btn btn-outline-warning" type="button" disabled>Открыть</button>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
