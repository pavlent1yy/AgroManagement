<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Кабинет кладовщика')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Кабинет кладовщика</h1>
        <span class="badge text-bg-success">Роль: Кладовщик</span>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-body p-4">
                    <div class="card-icon bg-success">📦</div>
                    <h2 class="h5">Складской учет</h2>
                    <p class="text-muted">Операции прихода и расхода ресурсов.</p>
                    <a th:href="@{/storekeeper/warehouse}" class="btn btn-success">Открыть</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-body p-4">
                    <div class="card-icon bg-warning">📋</div>
                    <h2 class="h5">Инвентаризация</h2>
                    <p class="text-muted">Проверка фактического наличия ресурсов.</p>
                    <button class="btn btn-outline-warning" type="button" disabled>Открыть</button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card">
                <div class="card-body p-4">
                    <div class="card-icon bg-primary">🧾</div>
                    <h2 class="h5">Заявки на закупку</h2>
                    <p class="text-muted">Формирование заявок на пополнение склада.</p>
                    <button class="btn btn-outline-primary" type="button" disabled>Открыть</button>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
