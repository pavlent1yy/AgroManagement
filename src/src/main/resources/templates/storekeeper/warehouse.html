<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Складской учет')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Складской учет</h1>
        <a th:href="@{/storekeeper/dashboard}" class="btn btn-outline-secondary">Назад</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row g-4 mb-4">
        <div class="col-lg-4">
            <div class="card form-card">
                <div class="card-body p-4">
                    <h2 class="h5 mb-3">Провести операцию</h2>
                    <form th:action="@{/storekeeper/warehouse}" th:object="${operationForm}" method="post">
                        <div class="mb-3">
                            <label for="itemId" class="form-label">Ресурс</label>
                            <select id="itemId" th:field="*{itemId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('itemId')} ? 'is-invalid'">
                                <option value="">Выберите ресурс</option>
                                <option th:each="item : ${items}" th:value="${item.id}"
                                        th:text="${item.name + ' (' + item.quantity + ' ' + item.unit + ')'}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('itemId')}" th:errors="*{itemId}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="operationType" class="form-label">Тип операции</label>
                            <select id="operationType" th:field="*{operationType}" class="form-select"
                                    th:classappend="${#fields.hasErrors('operationType')} ? 'is-invalid'">
                                <option value="">Выберите тип</option>
                                <option th:each="type : ${operationTypes}" th:value="${type}" th:text="${type.displayName}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('operationType')}" th:errors="*{operationType}"></div>
                        </div>
                        <div class="mb-4">
                            <label for="quantity" class="form-label">Количество</label>
                            <input id="quantity" th:field="*{quantity}" type="number" step="0.01" min="0.01" class="form-control"
                                   th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                        </div>
                        <button class="btn btn-success w-100" type="submit">Провести</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card form-card">
                <div class="card-body p-0">
                    <div class="p-3 border-bottom">
                        <h2 class="h5 mb-0">Текущие остатки</h2>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle table-agro mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Ресурс</th>
                                <th>Ед. измерения</th>
                                <th class="text-end">Остаток</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${items}">
                                <td th:text="${item.id}"></td>
                                <td class="fw-semibold" th:text="${item.name}"></td>
                                <td th:text="${item.unit}"></td>
                                <td class="text-end" th:classappend="${item.quantity < 100} ? 'quantity-low'"
                                    th:text="${item.quantity + ' ' + item.unit}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(items)}">
                                <td colspan="4" class="text-center text-muted py-4">Складские ресурсы отсутствуют.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body p-0">
            <div class="p-3 border-bottom">
                <h2 class="h5 mb-0">Журнал операций</h2>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle table-agro mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ресурс</th>
                        <th>Тип</th>
                        <th class="text-end">Количество</th>
                        <th>Дата</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="operation : ${operations}">
                        <td th:text="${operation.id}"></td>
                        <td class="fw-semibold" th:text="${operation.item.name}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${operation.operationType.name() == 'INCOME'} ? 'text-bg-success' : 'text-bg-danger'"
                                  th:text="${operation.operationType.displayName}">
                            </span>
                        </td>
                        <td class="text-end" th:text="${operation.quantity + ' ' + operation.item.unit}"></td>
                        <td th:text="${#temporals.format(operation.operationDate, 'dd.MM.yyyy')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(operations)}">
                        <td colspan="5" class="text-center text-muted py-4">Складские операции отсутствуют.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
